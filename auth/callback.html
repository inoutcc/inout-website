<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Opening in/out…</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #fb923c 0%, #ec4899 50%, #9333ea 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; box-sizing: border-box;
  }
  .card {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px; padding: 32px 24px;
    text-align: center; color: #fff;
  }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 20px;
    border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
  p { font-size: 13px; color: rgba(255,255,255,0.75); margin: 0 0 20px; line-height: 1.5; }
  a.btn {
    display: inline-block; background: #fff; color: #ec4899;
    font-weight: 800; font-size: 14px; text-decoration: none;
    padding: 12px 24px; border-radius: 16px; margin-top: 4px;
  }
  .fallback { display: none; margin-top: 18px; }
  .fallback.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Opening in/out…</h1>
    <p id="subtext">Hang tight — taking you back into the app.</p>
    <div class="fallback" id="fallback">
      <p>Didn't open automatically?</p>
      <a class="btn" id="openBtn" href="#">Open in/out</a>
      <p style="margin-top:16px;">
        Don't have the app yet?
        <a href="https://play.google.com/store/apps/details?id=co.inoutapp.android"
           style="color:#fff; text-decoration:underline;">Get it on Google Play</a>
      </p>
    </div>
  </div>
  <script>
    // Fallback landing page for the auth deep link (password reset, magic link,
    // signup confirm, Facebook OAuth). Normally Android never actually loads this —
    // a verified App Link (see /.well-known/assetlinks.json) hands off to the app
    // directly before the browser gets here. This only renders when verification
    // hasn't completed yet, the app isn't installed, or the link was opened on a
    // non-Android device — so it retries the handoff via the legacy custom scheme
    // and otherwise degrades to a manual "Open in/out" link + Play Store fallback.
    var hash = window.location.hash || "";
    var legacyUrl = "co.inoutapp.android://login-callback" + hash;
    document.getElementById("openBtn").href = legacyUrl;

    var opened = false;
    window.addEventListener("blur", function () { opened = true; });

    // Attempt the handoff once automatically.
    window.location.href = legacyUrl;

    // If we're still here after a beat, the auto-attempt didn't leave the page —
    // show the manual fallback instead of spinning forever.
    setTimeout(function () {
      if (opened) return;
      document.getElementById("spinner").style.display = "none";
      document.getElementById("heading").textContent = "Almost there";
      document.getElementById("subtext").textContent =
        "Tap below to finish opening in/out.";
      document.getElementById("fallback").className = "fallback show";
    }, 1800);
  </script>
</body>
</html>
